<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Signal Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f0f0f;
    color: white;
}

.header {
    padding: 15px;
    text-align: center;
    background: #111;
    font-size: 20px;
    font-weight: bold;
}

.card {
    background: #1c1c1c;
    margin: 10px;
    padding: 15px;
    border-radius: 10px;
}

.buy { color: #00ff88; }
.sell { color: #ff4d4d; }
.watch { color: #ffd11a; }

.container {
    padding: 10px;
}
</style>

</head>
<body>

<div class="header">
🚀 Live Crypto Signals
</div>

<div class="container" id="signals"></div>

<script>
const supabaseUrl = "https://hfjgukyubgcepqmzoxam.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhmamd1a3l1YmdjZXBxbXpveGFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNDQ5NDcsImV4cCI6MjA5NjYyMDk0N30.Rn8mB2BeFzOhUsExfDZhQ2t1a54T6vOdKHf7hy4jOCA";

const client = supabase.createClient(supabaseUrl, supabaseKey);

async function loadSignals() {

    let { data } = await client
        .from("signals")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(20);

    let html = "";

    data.forEach(item => {

        let color = "watch";
        if(item.signal_type.includes("BUY")) color = "buy";
        if(item.signal_type.includes("SELL")) color = "sell";

        html += `
        <div class="card">
            <h3>${item.coin}</h3>
            <p class="${color}">${item.signal_type}</p>
            <p>Score: ${item.score}</p>
            <p>Price: ${item.price}</p>
            <p>TP1: ${item.tp1} | TP2: ${item.tp2}</p>
            <p>SL: ${item.sl}</p>
        </div>
        `;
    });

    document.getElementById("signals").innerHTML = html;
}

loadSignals();
setInterval(loadSignals, 10000);
</script>

</body>
</html>
